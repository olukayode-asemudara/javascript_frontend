<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./index.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>

  <section class="nft-card">
    <img src="./images/image-equilibrium.jpg" alt="">
    
    <p class="nft-title">Equilibrium #3429</p>
    <span class="nft-description">Our Equilibrium collection promotes balance and calm</span>
    <div class="status">
      <div class="flex-items green">
        <img class="icon" src="./images/icon-ethereum.svg" alt="">
        <span>0.041 ETH</span>
      </div>
      
      <div class="flex-items">
        <img class="icon" src="./images/icon-clock.svg" alt="">
        <span>3 days left</span>
      </div>
    </div>

    <hr>
    
    <div class="attribution">
      <img class="avatar-img" src="./images/image-avatar.png" alt="">
      <p><span class="grey-text">Creation of</span> Jules Wyvern</p>
    </div>
  </section>


</body>
</html>
