<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./index.css">
    <title>calculator_app</title>
</head>
<body>
<!--calculator container-->
    <section>
        <div class="container">
    <!--    calculator screen    -->
            <div class="screen"></div>
    
    <!--    number keypads    -->
                <div class="keypads">
                    <button class="keypad clear">C</button>
                    <button class="keypad">1</button>
                    <button class="keypad">2</button>
                    <button class="keypad">3</button>
                    <button class="keypad">4</button>
                    <button class="keypad">5</button>
                    <button class="keypad">6</button>
                    <button class="keypad">7</button>
                    <button class="keypad">8</button>
                    <button class="keypad">9</button>
                    <button class="keypad">0</button>
                    <button class="keypad sum">+</button>
                    <button class="keypad minus">-</button>
                    <button class="keypad multiply">*</button>
                    <button class="keypad divide">/</button>
                    <button class="keypad equals">=</button>
                </div>
        </div>
    </section>

<script src="./index.js"></script>
</body>
</html>
